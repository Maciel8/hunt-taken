<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hunt Taken</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="top">
  <div class="logo">HUNT <span>TAKEN</span></div>
  <div class="tabs">
    <button data-tab="map">Mapa</button><button data-tab="market">Market</button><button data-tab="equip">Equipamento</button><button data-tab="ranks">Ranks</button><button data-tab="arena">Arena</button><button data-tab="war">Guerra</button><button data-tab="session">Sessão</button><button data-tab="settings">Ajustes</button>
  </div>
</nav>
<main class="cols">
  <aside class="col left">
    <section class="panel profile">
      <div class="pid"><div class="avatar" id="avatar"></div><div><b id="pname">—</b><div class="sub"><span id="pking">—</span> · <span id="pvoc">—</span></div></div><div class="lvl">Nv <b id="plvl">1</b></div></div>
      <div class="bar exp"><i id="expbar"></i></div><div class="sub center" id="pexp">0 / 0 xp</div>
      <div class="chips"><span class="chip gold">🪙 <b id="pgold">0</b></span><span class="chip"><b id="ppots">0</b> poções</span><span class="chip">exp <b id="multExp">×1</b></span><span class="chip">loot <b id="multLoot">×1</b></span></div>
      <div id="boosts" class="boosts"></div>
    </section>
    <section class="panel">
      <h2>Em campo</h2>
      <div class="row"><span>Vida</span><b id="hp">0</b></div><div class="bar hp"><i id="hpbar"></i></div>
      <div class="row"><span>Mana</span><b id="mana">0</b></div><div class="bar mana"><i id="manabar"></i></div>
      <div class="skills"><div class="row"><span>Espada</span><b id="skSword">10</b></div><div class="row"><span>Distância</span><b id="skDist">10</b></div><div class="row"><span>Magic</span><b id="skMagic">0</b></div><div class="row"><span>Escudo</span><b id="skShield">10</b></div><div class="row"><span>Ataque</span><b id="atk">0</b></div><div class="row"><span>Defesa</span><b id="def">0</b></div><div class="row"><span>Poder</span><b id="pow">0</b></div><div class="row"><span>Mochila</span><b id="bag">0</b></div><div class="row"><span>Bênção</span><b id="bless">não</b></div></div>
      <div class="sub">Status: <b id="task">—</b></div>
      <div class="actions"><button id="btnBless">Bênção (200)</button><button id="btnDeposit">Depositar</button><button id="btnIdle">Parar</button></div>
    </section>
    <section class="panel"><h2>Equipamento</h2><div id="equip" class="equip"></div></section>
  </aside>

  <section class="col center">
    <div class="map-wrap">
      <canvas id="view" width="832" height="520"></canvas>
      <div class="event" id="eventBar" hidden></div>
      <div class="toast" id="toast"></div>
      <div class="maptools"><button id="btnMapTab" class="primary">Escolher hunt</button><button id="btnCenter">Centrar</button><button id="btnSpeed">x1</button></div><div class="huntpop" id="huntPop" hidden></div>
    </div>
  </section>

  <aside class="col right">
    <section class="panel">
      <h2>Automações</h2>
      <label class="auto"><span>Usar poção abaixo de <b id="autoPotV">50%</b></span><input type="range" id="autoPot" min="10" max="90" value="50"></label>
      <label class="auto chk"><input type="checkbox" id="autoReturn" checked> Voltar pra hunt depois de morrer</label>
      <label class="auto chk"><input type="checkbox" id="autoDeposit" checked> Depositar quando encher ou faltar poção</label>
      <label class="auto chk"><input type="checkbox" id="autoSell" checked> Vender materiais no depósito</label>
      <label class="auto"><span>Repor poções até</span><input type="number" id="autoBuy" min="0" max="30" value="10"></label>
    </section>
    <section class="panel">
      <h2>Hunt atual</h2>
      <div class="row"><b id="huntName">—</b></div>
      <div id="huntStats"></div>
      <div id="occupants"></div>
    </section>
    <section class="panel feedp"><h2>Feed</h2><ul id="feed"></ul></section>
  </aside>
</main>

<div class="modal" id="modal" hidden><div class="box wide"><div class="mh"><h3 id="modalTitle">—</h3><button id="modalClose" class="x">✕</button></div><div id="modalBody"></div></div></div>
<div class="modal" id="report" hidden><div class="box"><h3>Relatório de volta</h3><p id="repSub"></p><div class="rep" id="repGrid"></div><div id="repNotes" class="muted"></div><button class="primary" id="repClose" style="width:100%">Continuar</button></div></div>
<div class="modal" id="create" hidden><div class="box"><h3>Criar personagem</h3><label class="auto"><span>Nome</span><input type="text" id="cName" maxlength="14" placeholder="Seu nome"></label><h4>Vocação</h4><div id="cVoc" class="picks"></div><h4>Reino</h4><div id="cKing" class="picks"></div><button class="primary" id="cGo" style="width:100%">Entrar no mundo</button></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
